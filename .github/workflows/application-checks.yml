name: PHP dependency and application checks
on:
  pull_request:
  push:
    branches: [main, codex/security-audit-2026-10-30]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: sodium, pdo_mysql, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-scripts
      - run: php bin/console cache:clear --env=test
      - run: php bin/console lint:container --env=test
      - run: php vendor/phpunit/phpunit/phpunit --configuration phpunit.xml.dist
      - run: composer audit
